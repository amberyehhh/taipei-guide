<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Taiwan Transport Guide</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', 'Noto Sans TC', sans-serif;
      background-color: #EDF6FC;
      color: #222B3A;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .soft-card {
      background-color: #FFFFFF;
      border-radius: 28px;
    }
    .speech-btn {
      background-color: #EEF0FA;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .speech-btn:active {
      transform: scale(0.98);
    }
    .tts-active {
      background-color: #E7F8F7 !important;
      color: #2D9C98 !important;
    }
    .card-active {
      border: 1.5px solid #3FB6F6;
    }
    .card-done {
      opacity: 0.85;
    }
    @keyframes floatTrain {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    .train-float {
      animation: floatTrain 2.2s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen pb-28 select-none">

  <!-- Non-blocking Toast Banner -->
  <div id="toastBanner" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden max-w-[90vw] bg-[#222B3A] text-white text-xs font-bold px-4 py-2.5 rounded-full text-center">
    <span id="toastText"></span>
  </div>

  <!-- Main Container -->
  <div class="max-w-md mx-auto px-4 pt-4 space-y-3.5">

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-30 bg-[#EDF6FC]/95 backdrop-blur-sm pt-1 pb-2 space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <!-- Left: Avatar + LV.1 + Route -->
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-10 h-10 rounded-full bg-[#FAD2C5] flex items-center justify-center shrink-0 overflow-hidden">
            <svg class="w-8 h-8" viewBox="0 0 36 36" fill="none">
              <circle cx="18" cy="14" r="6.5" fill="#FDE6D8"/>
              <path d="M11.5 13C11.5 9.2 14.4 6.8 18 6.8C21.6 6.8 24.5 9.2 24.5 13C23 11.4 20.8 10.6 18 10.6C15.2 10.6 13 11.4 11.5 13Z" fill="#222B3A"/>
              <circle cx="15.8" cy="14.2" r="0.9" fill="#222B3A"/>
              <circle cx="20.2" cy="14.2" r="0.9" fill="#222B3A"/>
              <path d="M16.4 16.8C17 17.5 19 17.5 19.6 16.8" stroke="#222B3A" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M9.5 31C9.5 25.8 13.3 22.5 18 22.5C22.7 22.5 26.5 25.8 26.5 31" fill="#3FB6F6"/>
            </svg>
          </div>
          <span class="bg-[#3FB6F6] text-white text-[11px] font-extrabold px-2 py-0.5 rounded-full shrink-0">LV.1</span>
          <h1 id="headerRouteTitle" class="text-[15px] font-extrabold text-[#222B3A] whitespace-nowrap">永康 ➔ 台北</h1>
        </div>

        <!-- Right: XP Pill + Language Toggle -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="promptResetProgress()" class="bg-white text-[#222B3A] text-xs font-extrabold px-2.5 py-1.5 rounded-full flex items-center gap-1 active:scale-95 transition-transform">
            <span class="text-[#F4A938]">★</span>
            <span id="xpValue">0</span>
            <span class="text-slate-400 text-sm leading-none ml-0.5">↻</span>
          </button>
          <button onclick="toggleLanguage()" class="bg-white text-[#222B3A] text-xs font-extrabold px-2.5 py-1.5 rounded-full flex items-center gap-1 active:scale-95 transition-transform">
            <span id="langFlag">🇻🇳</span>
            <span id="langCode">VI</span>
          </button>
        </div>
      </div>

      <!-- Room Sync Bar -->
      <div class="bg-white rounded-2xl px-3.5 py-2 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-[#4AC7C3] shrink-0"></span>
          <button onclick="openRoomCodeModal()" id="roomCodeLabel" class="text-xs font-extrabold text-slate-600 truncate">#521733</button>
          <button onclick="copyShareLink()" class="bg-[#E9F6FE] text-[#1D9CE0] text-[11px] font-extrabold px-2.5 py-1 rounded-full flex items-center gap-1 shrink-0 active:scale-95 transition-transform">
            <span>🔗</span>
            <span id="copyLinkLabel">Gửi link</span>
          </button>
        </div>
        <button id="notifyBtn" onclick="toggleNotifications()" class="bg-[#3FB6F6] text-white text-[11px] font-extrabold px-3 py-1.5 rounded-full flex items-center gap-1 shrink-0 active:scale-95 transition-transform">
          <span>🔔</span>
          <span id="notifyLabel">Báo chuông</span>
        </button>
      </div>
    </header>

    <!-- Outbound / Inbound Switcher -->
    <div class="bg-white rounded-full p-1 flex items-center">
      <button id="dirBtnOutbound" onclick="switchDirection('outbound')" class="flex-1 py-2.5 rounded-full text-xs font-extrabold bg-[#3FB6F6] text-white transition-colors">
        去程 永康 ➔ 台北
      </button>
      <button id="dirBtnInbound" onclick="switchDirection('inbound')" class="flex-1 py-2.5 rounded-full text-xs font-extrabold text-slate-500 transition-colors">
        回程 台北 ➔ 永康
      </button>
    </div>

    <!-- TAB 1: MAIN JOURNEY VIEW -->
    <main id="tab-journey" class="space-y-3.5">

      <!-- 4-Step Flat Progress Card (Zero Shadows, Zero Glow on Circles) -->
      <section class="soft-card px-5 pt-7 pb-5">
        <div class="relative flex items-start justify-between">
          <!-- Background Track Line -->
          <div class="absolute top-5 left-8 right-8 h-1 bg-[#E5EFF7] rounded-full"></div>
          <!-- Active Progress Fill Line -->
          <div id="progressFillLine" class="absolute top-5 left-8 h-1 bg-[#3FB6F6] rounded-full transition-all duration-300" style="width: 0%;"></div>
          <!-- Step Nodes -->
          <div id="stepNodesContainer" class="relative z-10 w-full flex justify-between"></div>
        </div>
      </section>

      <!-- Journey Step Cards -->
      <section id="cardsContainer" class="space-y-3.5"></section>
    </main>

    <!-- TAB 2: TICKET GUIDE VIEW -->
    <section id="tab-tickets" class="hidden space-y-3.5">
      <div class="soft-card p-5 space-y-3">
        <div class="bg-[#E9F6FE] rounded-2xl p-4 flex items-center justify-between">
          <div>
            <span class="text-[11px] font-extrabold text-[#3FB6F6]">TRA 區間車</span>
            <h2 id="ticketTraTitle" class="text-base font-extrabold text-[#222B3A] mt-0.5">Thẻ EasyCard</h2>
          </div>
          <span class="text-2xl">💳</span>
        </div>
        <p id="ticketTraDesc" class="text-xs font-semibold text-slate-600 leading-relaxed px-1">
          永康 ➔ 沙崙: Quẹt thẻ EasyCard ở cổng vào và cổng ra.
        </p>
      </div>

      <div class="soft-card p-5 space-y-3">
        <div class="bg-[#FEF5E6] rounded-2xl p-4 flex items-center justify-between">
          <div>
            <span class="text-[11px] font-extrabold text-[#F4A938]">THSR 高鐵</span>
            <h2 id="ticketThsrTitle" class="text-base font-extrabold text-[#222B3A] mt-0.5">Vé giấy tại quầy</h2>
          </div>
          <span class="text-2xl">🎫</span>
        </div>
        <p id="ticketThsrDesc" class="text-xs font-semibold text-slate-600 leading-relaxed px-1">
          Tàu Cao Tốc (高鐵): Mua vé giấy tại quầy và giữ vé để ra cổng.
        </p>
      </div>
    </section>

    <!-- TAB 3: FLASHCARDS COLLECTION VIEW -->
    <section id="tab-cards" class="hidden space-y-3">
      <div id="flashcardListContainer" class="space-y-3"></div>
    </section>

    <!-- TAB 4: INFO & CHECKLIST VIEW -->
    <section id="tab-info" class="hidden space-y-4">
      <div class="soft-card p-5 space-y-3.5">
        <h2 id="infoTitle" class="text-base font-extrabold text-[#222B3A]">Lưu ý tại ga Đài Bắc</h2>
        <div id="infoNotesList" class="bg-[#FEF5E6] rounded-2xl p-4 space-y-3 text-xs font-bold text-[#9C5E0C]"></div>
        <a href="https://trctrack.com/station/yongkang?to=shalun" target="_blank" class="w-full py-3.5 rounded-full bg-[#4AC7C3] text-white font-extrabold text-xs flex items-center justify-center gap-2">
          <span id="infoTimetableLabel">⏱ Giờ tàu 永康 ➔ 沙崙</span>
          <span>↗</span>
        </a>
      </div>
    </section>

  </div>

  <!-- Floating Coral SOS Button (Unobstructed Right-Thumb Zone) -->
  <button onclick="openSosFlashcard()" class="fixed bottom-20 right-4 z-30 bg-[#F48474] text-white font-extrabold text-sm px-4 py-3 rounded-full flex items-center gap-2 active:scale-95 transition-transform">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M4.93 4.93l4.24 4.24m5.66 5.66l4.24 4.24m0-14.14l-4.24 4.24m-5.66 5.66l-4.24 4.24"/></svg>
    <span>SOS</span>
  </button>

  <!-- Fixed Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-[#E3EFF8] rounded-t-3xl">
    <div class="max-w-md mx-auto px-3 py-2 flex items-center justify-around">
      <button onclick="switchTab('journey')" id="nav-journey" class="px-4 py-2 rounded-full bg-[#3FB6F6] text-white text-xs font-extrabold flex items-center gap-1.5 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path stroke-linecap="round" d="M8.5 19H12a4 4 0 004-4V9a4 4 0 014-4h-1"/></svg>
        <span id="navLabelJourney">Lộ trình</span>
      </button>
      <button onclick="switchTab('tickets')" id="nav-tickets" class="p-2.5 rounded-full text-slate-400 flex items-center gap-1.5 text-xs font-extrabold transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
        <span id="navLabelTickets" class="hidden">Vé tàu</span>
      </button>
      <button onclick="switchTab('cards')" id="nav-cards" class="p-2.5 rounded-full text-slate-400 flex items-center gap-1.5 text-xs font-extrabold transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path stroke-linecap="round" d="M8 10h8M8 14h5"/></svg>
        <span id="navLabelCards" class="hidden">Thẻ chữ</span>
      </button>
      <button onclick="switchTab('info')" id="nav-info" class="p-2.5 rounded-full text-slate-400 flex items-center gap-1.5 text-xs font-extrabold transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 11v5m0-8h.01"/></svg>
        <span id="navLabelInfo" class="hidden">Lưu ý</span>
      </button>
    </div>
  </nav>

  <!-- Large Chinese Flashcard Modal -->
  <div id="flashcardModal" onclick="closeFlashcardModal(event)" class="fixed inset-0 z-50 hidden bg-[#222B3A]/50 backdrop-blur-xs flex items-center justify-center p-5">
    <div onclick="event.stopPropagation()" class="bg-white rounded-[32px] w-full max-w-sm p-6 space-y-4">
      <div class="flex items-center justify-between">
        <span id="modalBadge" class="bg-[#E9F6FE] text-[#1D9CE0] text-[11px] font-extrabold px-3 py-1 rounded-full">請出示給工作人員</span>
        <button onclick="hideFlashcardModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold flex items-center justify-center">✕</button>
      </div>
      <div id="modalStaffHint" class="hidden bg-[#FEF5E6] text-[#9C5E0C] text-xs font-extrabold px-3.5 py-2.5 rounded-2xl">
        👮 請出示給閘門附近穿制服的工作人員
      </div>
      <div class="bg-[#F6FAFD] rounded-2xl p-5 space-y-2.5">
        <p id="modalZhText" class="text-2xl font-black text-[#222B3A] leading-snug"></p>
        <p id="modalViText" class="text-xs font-semibold text-slate-500 leading-relaxed"></p>
      </div>
      <button onclick="replayModalAudio()" class="w-full py-3.5 rounded-full bg-[#3FB6F6] text-white font-extrabold text-sm flex items-center justify-center gap-2 active:scale-98 transition-transform">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        <span id="modalSpeakLabel">Nghe lại / 再次播放</span>
      </button>
    </div>
  </div>

  <!-- Custom Reset Confirmation Modal -->
  <div id="resetModal" onclick="if(event.target===this) closeResetModal()" class="fixed inset-0 z-50 hidden bg-[#222B3A]/50 flex items-center justify-center p-5">
    <div class="bg-white rounded-[28px] w-full max-w-xs p-6 space-y-4 text-center">
      <h3 id="resetModalTitle" class="text-base font-extrabold text-[#222B3A]">Đặt lại tiến độ?</h3>
      <div class="flex gap-2.5">
        <button onclick="closeResetModal()" class="flex-1 py-3 rounded-full bg-slate-100 text-slate-600 text-xs font-extrabold">Hủy / 取消</button>
        <button onclick="confirmResetProgress()" class="flex-1 py-3 rounded-full bg-[#F48474] text-white text-xs font-extrabold">Đặt lại / 重置</button>
      </div>
    </div>
  </div>

  <!-- Custom Room Code Modal -->
  <div id="roomModal" onclick="if(event.target===this) closeRoomCodeModal()" class="fixed inset-0 z-50 hidden bg-[#222B3A]/50 flex items-center justify-center p-5">
    <div class="bg-white rounded-[28px] w-full max-w-xs p-6 space-y-4">
      <h3 class="text-sm font-extrabold text-[#222B3A]">Mã phòng / 房間代碼 (6 số)</h3>
      <input id="roomCodeInput" type="text" maxlength="6" inputmode="numeric" class="w-full bg-[#F6FAFD] border border-[#E3EFF8] rounded-2xl px-4 py-3 text-center text-lg font-black tracking-widest text-[#222B3A] focus:outline-none focus:border-[#3FB6F6]" />
      <div class="flex gap-2.5">
        <button onclick="closeRoomCodeModal()" class="flex-1 py-2.5 rounded-full bg-slate-100 text-slate-600 text-xs font-extrabold">Hủy</button>
        <button onclick="saveCustomRoomCode()" class="flex-1 py-2.5 rounded-full bg-[#3FB6F6] text-white text-xs font-extrabold">Lưu / 儲存</button>
      </div>
    </div>
  </div>

    // Initialize Application
    window.addEventListener('DOMContentLoaded', () => {
      initRoomCode();
      loadSavedState();
      renderAll();
    });

    function initRoomCode() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        const urlDir = params.get('dir');
        if (urlRoom && /^\d{6}$/.test(urlRoom)) {
          roomCode = urlRoom;
          localStorage.setItem('taipei_quest_room', roomCode);
        } else {
          const stored = localStorage.getItem('taipei_quest_room');
          if (stored && /^\d{6}$/.test(stored)) {
            roomCode = stored;
          } else {
            roomCode = String(Math.floor(100000 + Math.random() * 900000));
            localStorage.setItem('taipei_quest_room', roomCode);
          }
        }
        if (urlDir === 'inbound' || urlDir === 'in') {
          direction = 'inbound';
        }
      } catch (e) {
        roomCode = '521733';
      }
      document.getElementById('roomCodeLabel').innerText = `#${roomCode}`;
      syncUrlSilently();
    }

    function syncUrlSilently() {
      try {
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
          const url = new URL(window.location.href);
          url.searchParams.set('room', roomCode);
          url.searchParams.set('dir', direction);
          window.history.replaceState({}, '', url.toString());
        }
      } catch (e) {
        // Ignore in sandboxed iframe/blob preview
      }
    }

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(`taipei_quest_state_${roomCode}`);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.outbound)) state.outbound = parsed.outbound;
          if (Array.isArray(parsed.inbound)) state.inbound = parsed.inbound;
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(`taipei_quest_state_${roomCode}`, JSON.stringify(state));
      } catch (e) {}
    }

    // Toast Helper
    function showToast(msg) {
      const banner = document.getElementById('toastBanner');
      document.getElementById('toastText').innerText = msg;
      banner.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => banner.classList.add('hidden'), 2600);
    }

    // Language & Direction Switchers
    function toggleLanguage() {
      lang = lang === 'VI' ? 'ZH' : 'VI';
      document.getElementById('langFlag').innerText = lang === 'VI' ? '🇻🇳' : '🇹🇼';
      document.getElementById('langCode').innerText = lang === 'VI' ? 'VI' : '中文';
      renderAll();
    }

    function switchDirection(newDir) {
      direction = newDir;
      syncUrlSilently();
      renderAll();
    }

    function switchTab(tabName) {
      const tabs = ['journey', 'tickets', 'cards', 'info'];

        const lbl = document.getElementById(`navLabel${t.charAt(0).toUpperCase() + t.slice(1)}`);

          if (lbl) lbl.classList.add('hidden');
        }

    }

                  <div class="min-w-0">
                    <h2 class="text-[15px] font-extrabold text-[#222B3A] whitespace-nowrap">${s.title}</h2>
                    <span class="text-xs font-extrabold text-[#6C76C8]">+${s.xp} XP</span>
                  </div>
                </div>
                <button onclick="toggleStepDone(${idx})" class="${checkBtnClass}">${checkBtnLabel}</button>
              </div>
              ${westExitSignHtml}
              ${exitNotesHtml}
              ${homeBannerHtml}
              ${phraseBtnHtml}
            </article>
          `;
        }

        // Standard Transport / Walking Card
        let bannerBg = 'bg-[#EBF7FF]';
        let tagColor = 'text-[#289EE8]';
        let ctaBg = 'bg-[#45B6FE]';
        let vehicleSvg = `
          <svg class="w-12 h-10" viewBox="0 0 48 40" fill="none">
            <rect x="6" y="8" width="36" height="22" rx="6" fill="#45B6FE"/>
            <rect x="10" y="12" width="11" height="8" rx="2" fill="#EBF7FF"/>
            <rect x="24" y="12" width="14" height="8" rx="2" fill="#EBF7FF"/>
            <circle cx="15" cy="30" r="3" fill="#222B3A"/>
            <circle cx="33" cy="30" r="3" fill="#222B3A"/>
            <path d="M4 34h40" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
          </svg>
        `;

        if (s.type === 'walk') {
          bannerBg = 'bg-[#E8FAF9]';
          tagColor = 'text-[#2CB5B0]';
          ctaBg = 'bg-[#4ED2CE]';
          vehicleSvg = `
            <div class="w-11 h-11 rounded-2xl bg-white/80 flex items-center justify-center text-xl">🚶‍♂️</div>
          `;
        } else if (s.type === 'thsr') {
          bannerBg = 'bg-[#FFF7EB]';
          tagColor = 'text-[#D9820B]';
          ctaBg = 'bg-[#F7AD3E]';
          vehicleSvg = `
            <svg class="w-12 h-10" viewBox="0 0 48 40" fill="none">
              <path d="M8 28C8 17 16 10 28 10H38C40.2 10 42 11.8 42 14V24C42 26.2 40.2 28 38 28H8Z" fill="#F7AD3E"/>
              <path d="M12 22C13 17 17 14 23 14H36V20H12V22Z" fill="#FFFBEB"/>
              <path d="M4 32h40" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
            </svg>
          `;
        }

        const platformPillHtml = s.platformPill
          ? `<span class="bg-white text-[#222B3A] text-[11px] font-extrabold px-2.5 py-0.5 rounded-full whitespace-nowrap">${s.platformPill}</span>`
          : '';

        const seatPillHtml = s.seatPillVi
          ? `<span class="bg-white text-[#D9820B] text-[11px] font-extrabold px-2.5 py-0.5 rounded-full whitespace-nowrap">${lang === 'VI' ? s.seatPillVi : s.seatPillZh}</span>`
          : '';

        const arrivalHintHtml = s.arrivalHintVi ? `
          <div class="bg-[#FFF7EB] rounded-2xl px-4 py-3 flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-white text-[#F7AD3E] flex items-center justify-center shrink-0 text-sm">📢</div>
            <span class="text-xs font-extrabold text-[#9C5E0C]">${lang === 'VI' ? s.arrivalHintVi : s.arrivalHintZh}</span>
          </div>
        ` : '';

        const mintRowHtml = s.mintBadge ? `
          <div class="bg-[#E8FAF9] rounded-2xl px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
              <svg class="w-5 h-5 text-[#2CB5B0] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path stroke-linecap="round" d="M8 3l4 3 4-3"/></svg>
              <span class="bg-white text-[#2CB5B0] text-xs font-extrabold px-2.5 py-1 rounded-lg whitespace-nowrap">${s.mintBadge}</span>
              <span class="text-xs font-extrabold text-[#222B3A] whitespace-nowrap">${lang === 'VI' ? s.mintTextVi : s.mintTextZh}</span>
            </div>
            <a href="${s.timetableUrl}" target="_blank" class="bg-[#4ED2CE] text-white text-[11px] font-extrabold px-3 py-1.5 rounded-full flex items-center gap-1 shrink-0 whitespace-nowrap">
              <span>⏱</span>
              <span>${lang === 'VI' ? 'Giờ tàu' : '時刻表'}</span>
              <span>↗</span>
            </a>
          </div>
        ` : '';

        const timerRowHtml = s.showTimer ? `
          <div class="bg-[#F4F9FD] rounded-2xl px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-xl bg-[#FFF7EB] text-[#F7AD3E] flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 7v5l3 2"/></svg>
              </div>
              <span id="thsrTimerDisplay" class="text-sm font-black text-[#222B3A]">${formatSeconds(timerSeconds)}</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="toggleThsrTimer()" class="bg-[#F7AD3E] text-white text-[11px] font-extrabold px-3.5 py-1.5 rounded-full whitespace-nowrap">
                ${timerRunning ? (lang === 'VI' ? 'Tạm dừng' : '暫停') : (lang === 'VI' ? 'Bắt đầu' : '開始')}
              </button>
              <button onclick="resetThsrTimer()" class="bg-[#E6F0F8] text-slate-600 text-[11px] font-extrabold px-2.5 py-1.5 rounded-full">↻</button>
            </div>
          </div>
        ` : '';

        const phrasesGridHtml = s.phrases.map(p => `
          <button onclick="handlePhraseClick(this, '${escapeAttr(p.zh)}', '${escapeAttr(p.vi)}', ${Boolean(p.staffHint)})" class="speech-btn rounded-2xl px-3.5 py-3.5 flex items-center justify-between gap-2 text-left">
            <span class="text-xs font-extrabold text-[#222B3A] leading-snug">${lang === 'VI' ? p.labelVi : p.labelZh}</span>
            <svg class="w-4 h-4 text-[#6C76C8] shrink-0" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
          </button>
        `).join('');

        const mainBtnClass = isDone
          ? 'w-full py-3.5 rounded-full bg-[#E8FAF9] text-[#2CB5B0] font-extrabold text-sm flex items-center justify-center gap-2 transition-colors'
          : `w-full py-3.5 rounded-full ${ctaBg} text-white font-extrabold text-sm flex items-center justify-center gap-2 active:scale-[0.99] transition-all`;

        const mainBtnText = isDone
          ? (lang === 'VI' ? s.btnDoneVi : s.btnDoneZh)
          : (lang === 'VI' ? s.btnTodoVi : s.btnTodoZh);

        return `
          <article id="step-card-${idx}" class="soft-card ${cardStateClass} p-5 space-y-3 transition-all">
            <div class="${bannerBg} rounded-2xl p-4 flex items-center justify-between gap-2">
              <div class="space-y-1.5 min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="${tagColor} text-xs font-extrabold whitespace-nowrap">${s.tagLeft}</span>
                  ${platformPillHtml}
                  ${seatPillHtml}
                  <span class="bg-white/90 text-[#289EE8] text-[11px] font-extrabold px-2.5 py-0.5 rounded-full whitespace-nowrap">+${s.xp} XP</span>
                </div>
                <h2 class="text-lg font-extrabold text-[#222B3A] whitespace-nowrap">${s.title}</h2>
              </div>
              <div class="shrink-0">${vehicleSvg}</div>
            </div>

            <div class="bg-[#F4F9FD] rounded-2xl px-4 py-3 flex items-center gap-3">
              <div class="w-8 h-8 rounded-xl bg-[#EBF7FF] text-[#45B6FE] flex items-center justify-center shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>
              </div>
              <span class="text-xs font-extrabold text-[#222B3A]">${lang === 'VI' ? s.infoTextVi : s.infoTextZh}</span>
            </div>

            ${arrivalHintHtml}
            ${mintRowHtml}
            ${timerRowHtml}

            <div class="grid grid-cols-2 gap-2.5">
              ${phrasesGridHtml}
            </div>

            <button onclick="toggleStepDone(${idx})" class="${mainBtnClass}">
              <span class="w-5 h-5 rounded-full border-2 border-current flex items-center justify-center text-[11px]">✓</span>
              <span>${mainBtnText}</span>
            </button>
          </article>
        `;
      }).join('');

      updateSecondaryTabsLanguage();
      renderFlashcardsTab();
    }

    function updateSecondaryTabsLanguage() {
      document.getElementById('ticketTraTitle').innerText = lang === 'VI' ? 'Thẻ EasyCard' : 'EasyCard 悠遊卡';
      document.getElementById('ticketTraDesc').innerText = lang === 'VI'
        ? '永康 ➔ 沙崙: Quẹt thẻ EasyCard ở cổng vào và cổng ra.'
        : '永康 ➔ 沙崙：直接刷悠遊卡進出站即可。';
      document.getElementById('ticketThsrTitle').innerText = lang === 'VI' ? 'Vé giấy tại quầy' : '紙本車票';
      document.getElementById('ticketThsrDesc').innerText = lang === 'VI'
        ? 'Tàu Cao Tốc (高鐵): Mua vé giấy tại quầy và giữ vé để ra cổng.'
        : '高鐵需至櫃檯購買紙本車票，出站時需插入票卡。';

      document.getElementById('infoTitle').innerText = lang === 'VI' ? 'Lưu ý tại ga Đài Bắc' : '台北車站下車提醒';
      document.getElementById('infoTimetableLabel').innerText = lang === 'VI' ? '⏱ Giờ tàu 永康 ➔ 沙崙' : '⏱ 永康 ➔ 沙崙 時刻表';
      document.getElementById('infoNotesList').innerHTML = `
        <div class="flex items-center gap-2.5"><span>🎫</span><span>${lang === 'VI' ? 'Đút vé giấy cao tốc để ra cổng (Không quẹt thẻ)' : '高鐵出站閘門要「插紙本票」（不要刷悠遊卡）'}</span></div>
        <div class="flex items-center gap-2.5"><span>⬆️</span><span>${lang === 'VI' ? 'Tìm cầu thang đi LÊN' : '下車後一定要找「往上走」的樓梯'}</span></div>
        <div class="flex items-center gap-2.5"><span>🚫</span><span>${lang === 'VI' ? 'Không đi ngược chiều' : '部分樓梯不通行，注意不要逆向'}</span></div>
        <div class="flex items-center gap-2.5"><span>👮</span><span>${lang === 'VI' ? 'Không biết đường thì hỏi nhân viên mặc đồng phục gần cổng' : '不會走時，可找閘門旁「穿制服工作人員」問路'}</span></div>
      `;
    }

    function renderFlashcardsTab() {
      const container = document.getElementById('flashcardListContainer');
      const allSteps = JOURNEY_DATA[direction].steps;
      let html = '';
      allSteps.forEach(step => {
        step.phrases.forEach(p => {
          html += `
            <div onclick="openFlashcard('${escapeAttr(p.zh)}', '${escapeAttr(p.vi)}', ${Boolean(p.staffHint)})" class="soft-card p-5 space-y-2 cursor-pointer active:scale-[0.99] transition-transform">
              <div class="flex items-center justify-between">
                <span class="bg-[#E9F6FE] text-[#1D9CE0] text-[11px] font-extrabold px-2.5 py-0.5 rounded-full">${step.title}</span>
                <svg class="w-5 h-5 text-[#6E7AC2]" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
              </div>
              <p class="text-base font-black text-[#222B3A] leading-snug">${p.zh}</p>
              ${lang === 'VI' ? `<p class="text-xs font-semibold text-slate-500">${p.vi}</p>` : ''}
            </div>
          `;
        });
      });
      container.innerHTML = html;
    }

    // Speech Synthesis & Flashcard Modal
    function handlePhraseClick(btnEl, zhText, viText, staffHint) {
      if (btnEl) {
        btnEl.classList.add('tts-active');
        setTimeout(() => btnEl.classList.remove('tts-active'), 2000);
      }
      speakChinese(zhText);
      openFlashcard(zhText, viText, staffHint);
    }

    function speakChinese(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'zh-TW';
          utter.rate = 0.88;
          window.speechSynthesis.speak(utter);
        }
      } catch (e) {}
    }

    function openFlashcard(zhText, viText, staffHint) {
      currentModalZh = zhText;
      document.getElementById('modalZhText').innerText = zhText;
      document.getElementById('modalViText').innerText = viText;
      document.getElementById('modalStaffHint').classList.toggle('hidden', !staffHint);
      document.getElementById('flashcardModal').classList.remove('hidden');
    }

    function openSosFlashcard() {
      const zh = '你好，我是越南人，我不會說中文，請幫幫我聯絡我的家人，謝謝！';
      const vi = 'Xin chào, tôi là người Việt Nam, tôi không biết nói tiếng Trung, xin hãy giúp tôi liên lạc với người nhà, cảm ơn!';
      speakChinese(zh);
      openFlashcard(zh, vi, false);
    }

    function replayModalAudio() {
      if (currentModalZh) speakChinese(currentModalZh);
    }

    function hideFlashcardModal() {
      document.getElementById('flashcardModal').classList.add('hidden');
    }

    function closeFlashcardModal(e) {
      if (e.target.id === 'flashcardModal') hideFlashcardModal();
    }

    // THSR 1h 40m Countdown Timer
    function formatSeconds(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function toggleThsrTimer() {
      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
      } else {
        timerRunning = true;
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            const el = document.getElementById('thsrTimerDisplay');
            if (el) el.innerText = formatSeconds(timerSeconds);
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            playChime();
            showToast('⏰ Sắp tới ga! / 即將到站！');
          }
        }, 1000);
      }
      renderAll();
    }

    function resetThsrTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      timerSeconds = 6000;
      renderAll();
    }

    // Custom Reset & Room Code Modals
    function promptResetProgress() {
      document.getElementById('resetModalTitle').innerText = lang === 'VI' ? 'Đặt lại tiến độ chặng này?' : '重置目前方向進度？';
      document.getElementById('resetModal').classList.remove('hidden');
    }

    function closeResetModal() {
      document.getElementById('resetModal').classList.add('hidden');
    }

    function confirmResetProgress() {
      state[direction] = [false, false, false, false];
      saveState();
      closeResetModal();
      renderAll();
      showToast(lang === 'VI' ? 'Đã đặt lại tiến độ' : '已重置進度');
    }

    function openRoomCodeModal() {
      document.getElementById('roomCodeInput').value = roomCode;
      document.getElementById('roomModal').classList.remove('hidden');
    }

    function closeRoomCodeModal() {
      document.getElementById('roomModal').classList.add('hidden');
    }

    function saveCustomRoomCode() {
      const val = document.getElementById('roomCodeInput').value.trim();
      if (/^\d{6}$/.test(val)) {
        roomCode = val;
        try { localStorage.setItem('taipei_quest_room', roomCode); } catch (e) {}
        document.getElementById('roomCodeLabel').innerText = `#${roomCode}`;
        syncUrlSilently();
        loadSavedState();
        renderAll();
        closeRoomCodeModal();
        showToast(`#${roomCode}`);
      } else {
        showToast(lang === 'VI' ? 'Nhập đúng 6 chữ số' : '請輸入 6 位數字');
      }
    }

    // Copy Shareable Link & ntfy.sh Sync
    function copyShareLink() {
      let shareUrl = '';
      try {
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
          const url = new URL(window.location.href);
          url.searchParams.set('room', roomCode);
          url.searchParams.set('dir', direction);
          shareUrl = url.toString();
        } else {
          shareUrl = `https://amberyehhh.github.io/taipei-guide/?room=${roomCode}&dir=${direction}`;
        }
      } catch (e) {
        shareUrl = `https://amberyehhh.github.io/taipei-guide/?room=${roomCode}&dir=${direction}`;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast(lang === 'VI' ? 'Đã sao chép link!' : '已複製連結！');
        }).catch(() => fallbackCopyText(shareUrl));
      } else {
        fallbackCopyText(shareUrl);
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      showToast(lang === 'VI' ? 'Đã sao chép link!' : '已複製連結！');
    }

    function toggleNotifications() {
      notifyEnabled = !notifyEnabled;
      const btn = document.getElementById('notifyBtn');
      if (notifyEnabled) {
        btn.className = 'bg-[#4AC7C3] text-white text-[11px] font-extrabold px-3 py-1.5 rounded-full flex items-center gap-1 shrink-0 transition-colors';
        startNtfySubscription();
        playChime();
        showToast(lang === 'VI' ? 'Đã bật thông báo' : '已開啟同步通知');
      } else {
        btn.className = 'bg-[#3FB6F6] text-white text-[11px] font-extrabold px-3 py-1.5 rounded-full flex items-center gap-1 shrink-0 transition-colors';
        if (eventSource) {
          eventSource.close();
          eventSource = null;
        }
      }
      renderAll();
    }

    function startNtfySubscription() {
      try {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(`https://ntfy.sh/taipei-quest-${roomCode}/sse`);
        eventSource.onmessage = (e) => {
          try {
            const payload = JSON.parse(e.data);
            if (payload && payload.message) {
              playChime();
              showToast(`🔔 ${payload.message}`);
            }
          } catch (err) {}
        };
      } catch (e) {}
    }

    function publishSyncUpdate(stepTitle) {
      try {
        fetch(`https://ntfy.sh/taipei-quest-${roomCode}`, {
          method: 'POST',
          body: `✓ ${stepTitle}`
        }).catch(() => {});
      } catch (e) {}
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function scrollToStep(idx) {
      const target = document.getElementById(`step-card-${idx}`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function escapeAttr(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
