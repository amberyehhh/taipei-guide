<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Taiwan Transport Guide</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', 'Noto Sans TC', sans-serif;
      background-color: #EDF6FC;
      color: #2C3E50;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .soft-card {
      background-color: #FFFFFF;
      border-radius: 28px;
    }
    .speech-btn {
      background-color: #F4F9FD;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .speech-btn:active {
      transform: scale(0.98);
    }
    .tts-active {
      background-color: #E6F8F7 !important;
      color: #1F8E89 !important;
    }
    .card-active {
      border: 1.5px solid #45B6FE;
    }
    .card-done {
      opacity: 0.92;
    }
    @keyframes floatTrain {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    .train-float {
      animation: floatTrain 2.2s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen pb-28 select-none">

  <!-- Non-blocking Toast Banner -->
  <div id="toastBanner" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden max-w-[90vw] bg-[#2C3E50] text-white text-xs font-bold px-4 py-2.5 rounded-full text-center">
    <span id="toastText"></span>
  </div>

  <!-- Main Container -->
  <div class="max-w-md mx-auto px-4 pt-4 space-y-3.5">

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-30 bg-[#EDF6FC]/95 backdrop-blur-sm pt-1 pb-2 space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <!-- Left: Avatar + LV.1 + Route -->
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-10 h-10 rounded-full bg-[#FAD2C5] flex items-center justify-center shrink-0 overflow-hidden">
            <svg class="w-8 h-8" viewBox="0 0 36 36" fill="none">
              <circle cx="18" cy="14" r="6.5" fill="#FDE6D8"/>
              <path d="M11.5 13C11.5 9.2 14.4 6.8 18 6.8C21.6 6.8 24.5 9.2 24.5 13C23 11.4 20.8 10.6 18 10.6C15.2 10.6 13 11.4 11.5 13Z" fill="#2C3E50"/>
              <circle cx="15.8" cy="14.2" r="0.9" fill="#2C3E50"/>
              <circle cx="20.2" cy="14.2" r="0.9" fill="#2C3E50"/>
              <path d="M16.4 16.8C17 17.5 19 17.5 19.6 16.8" stroke="#2C3E50" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M9.5 31C9.5 25.8 13.3 22.5 18 22.5C22.7 22.5 26.5 25.8 26.5 31" fill="#45B6FE"/>
            </svg>
          </div>
          <span class="bg-[#45B6FE] text-white text-[11px] font-extrabold px-2 py-0.5 rounded-full shrink-0">LV.1</span>
          <h1 id="headerRouteTitle" class="text-[15px] font-extrabold text-[#2C3E50] whitespace-nowrap">永康 ➔ 台北</h1>
        </div>

        <!-- Right: XP Pill + Language Toggle -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="promptResetProgress()" class="bg-white text-[#2C3E50] text-xs font-extrabold px-2.5 py-1.5 rounded-full flex items-center gap-1 active:scale-95 transition-transform">
            <span class="text-[#F7AD3E]">★</span>
            <span id="xpValue">0</span>
            <span class="text-slate-400 text-sm leading-none ml-0.5">↻</span>
          </button>
          <button onclick="toggleLanguage()" class="bg-white text-[#2C3E50] text-xs font-extrabold px-2.5 py-1.5 rounded-full flex items-center gap-1 active:scale-95 transition-transform">
            <span id="langFlag">🇻🇳</span>
            <span id="langCode">VI</span>
          </button>
        </div>
      </div>

      <!-- Room Sync Bar -->
      <div class="bg-white rounded-2xl px-3.5 py-2 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-[#3CC6C0] shrink-0"></span>
          <button onclick="openRoomCodeModal()" id="roomCodeLabel" class="text-xs font-extrabold text-slate-600 truncate">#521733</button>
          <button onclick="copyShareLink()" class="bg-[#EBF7FF] text-[#1B85C9] text-[11px] font-extrabold px-2.5 py-1 rounded-full flex items-center gap-1 shrink-0 active:scale-95 transition-transform">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
            <span id="copyLinkLabel">Gửi link</span>
          </button>
        </div>
        <button id="notifyBtn" onclick="toggleNotifications()" class="bg-[#45B6FE] text-white text-[11px] font-extrabold px-3 py-1.5 rounded-full flex items-center gap-1 shrink-0 active:scale-95 transition-transform">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span id="notifyLabel">Báo chuông</span>
        </button>
      </div>
    </header>

    <!-- Outbound / Inbound Switcher -->
    <div class="bg-white rounded-full p-1 flex items-center">
      <button id="dirBtnOutbound" onclick="switchDirection('outbound')" class="flex-1 py-2.5 rounded-full text-xs font-extrabold bg-[#45B6FE] text-white transition-colors">
        去程 永康 ➔ 台北
      </button>
      <button id="dirBtnInbound" onclick="switchDirection('inbound')" class="flex-1 py-2.5 rounded-full text-xs font-extrabold text-slate-500 transition-colors">
        回程 台北 ➔ 永康
      </button>
    </div>

    <!-- TAB 1: MAIN JOURNEY VIEW -->
    <main id="tab-journey" class="space-y-3.5">

      <!-- 4-Step Flat Progress Card (Zero Shadows, Zero Glow on Circles) -->
      <section class="soft-card px-5 pt-7 pb-5">
        <div class="relative flex items-start justify-between">
          <!-- Background Track Line -->
          <div class="absolute top-5 left-8 right-8 h-1 bg-[#E5EFF7] rounded-full"></div>
          <!-- Active Progress Fill Line -->
          <div id="progressFillLine" class="absolute top-5 left-8 h-1 bg-[#45B6FE] rounded-full transition-all duration-300" style="width: 0%;"></div>
          <!-- Step Nodes -->
          <div id="stepNodesContainer" class="relative z-10 w-full flex justify-between"></div>
        </div>
      </section>

      <!-- Journey Step Cards -->
      <section id="cardsContainer" class="space-y-3.5"></section>
    </main>

    <!-- TAB 2: TICKET GUIDE VIEW -->
    <section id="tab-tickets" class="hidden space-y-3.5">
      <div class="soft-card p-5 space-y-3">
        <div class="bg-[#EBF7FF] rounded-2xl p-4 flex items-center justify-between">
          <div class="space-y-1">
            <span class="text-[11px] font-extrabold text-[#289EE8]">TRA 區間車 (永康 ⇄ 沙崙)</span>
            <h2 id="ticketTraTitle" class="text-base font-extrabold text-[#2C3E50]">EasyCard 刷卡進出</h2>
          </div>
          <span class="bg-white text-[#289EE8] text-xs font-extrabold px-3 py-1 rounded-full shrink-0">Tap In / Out</span>
        </div>
      </div>

      <div class="soft-card p-5 space-y-3">
        <div class="bg-[#FFF7EB] rounded-2xl p-4 flex items-center justify-between">
          <div class="space-y-1">
            <span class="text-[11px] font-extrabold text-[#D9820B]">THSR 高鐵 (台南 ⇄ 台北)</span>
            <h2 id="ticketThsrTitle" class="text-base font-extrabold text-[#2C3E50]">櫃檯買票 ➔ 插紙本票</h2>
          </div>
          <span class="bg-white text-[#D9820B] text-xs font-extrabold px-3 py-1 rounded-full shrink-0">Paper Ticket</span>
        </div>
      </div>
    </section>

    <!-- TAB 3: FLASHCARDS COLLECTION VIEW -->
    <section id="tab-cards" class="hidden space-y-3">
      <div id="flashcardListContainer" class="space-y-3"></div>
    </section>

    <!-- TAB 4: INFO & CHECKLIST VIEW -->
    <section id="tab-info" class="hidden space-y-4">
      <div class="soft-card p-5 space-y-3.5">
        <h2 id="infoTitle" class="text-base font-extrabold text-[#2C3E50]">台北車站下車重點</h2>
        <div id="infoNotesList" class="grid grid-cols-3 gap-2 text-center text-[11px] font-extrabold text-[#2C3E50]"></div>
        <div class="grid grid-cols-2 gap-2">
          <a href="https://trctrack.com/station/yongkang?to=shalun" target="_blank" class="py-3.5 px-3 rounded-full bg-[#3CC6C0] text-white font-extrabold text-xs flex items-center justify-center gap-1.5">
            <span id="infoTimetableLabel">台鐵時刻表</span>
            <span>↗</span>
          </a>
          <button onclick="openThsrTimetable('1000', '1060')" class="py-3.5 px-3 rounded-full bg-[#F7AD3E] text-white font-extrabold text-xs flex items-center justify-center gap-1.5 active:scale-95 transition-transform">
            <span id="infoThsrTimetableLabel">高鐵時刻表</span>
            <span>↗</span>
          </button>
        </div>
      </div>
    </section>

  </div>

  <!-- Floating Warm Coral-Amber SOS Button -->
  <button onclick="openSosFlashcard()" class="fixed bottom-20 right-4 z-30 bg-[#F5946E] text-white font-extrabold text-sm px-4 py-3 rounded-full flex items-center gap-2 active:scale-95 transition-transform">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M4.93 4.93l4.24 4.24m5.66 5.66l4.24 4.24m0-14.14l-4.24 4.24m-5.66 5.66l-4.24 4.24"/></svg>
    <span>SOS</span>
  </button>

  <!-- Fixed Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-[#E3EFF8] rounded-t-3xl">
    <div class="max-w-md mx-auto px-3 py-2 flex items-center justify-around">
      <button onclick="switchTab('journey')" id="nav-journey" class="px-4 py-2 rounded-full bg-[#45B6FE] text-white text-xs font-extrabold flex items-center gap-1.5 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path stroke-linecap="round" d="M8.5 19H12a4 4 0 004-4V9a4 4 0 014-4h-1"/></svg>
        <span id="navLabelJourney">Lộ trình</span>
      </button>
      <button onclick="switchTab('tickets')" id="nav-tickets" class="p-2.5 rounded-full text-slate-400 flex items-center gap-1.5 text-xs font-extrabold transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
        <span id="navLabelTickets" class="hidden">Vé tàu</span>
      </button>
      <button onclick="switchTab('cards')" id="nav-cards" class="p-2.5 rounded-full text-slate-400 flex items-center gap-1.5 text-xs font-extrabold transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path stroke-linecap="round" d="M8 10h8M8 14h5"/></svg>
        <span id="navLabelCards" class="hidden">Thẻ chữ</span>
      </button>
      <button onclick="switchTab('info')" id="nav-info" class="p-2.5 rounded-full text-slate-400 flex items-center gap-1.5 text-xs font-extrabold transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 11v5m0-8h.01"/></svg>
        <span id="navLabelInfo" class="hidden">Lưu ý</span>
      </button>
    </div>
  </nav>

  <!-- Large Chinese Flashcard Modal -->
  <div id="flashcardModal" onclick="closeFlashcardModal(event)" class="fixed inset-0 z-50 hidden bg-[#2C3E50]/50 backdrop-blur-xs flex items-center justify-center p-5">
    <div onclick="event.stopPropagation()" class="bg-white rounded-[32px] w-full max-w-sm p-6 space-y-4">
      <div class="flex items-center justify-between">
        <span id="modalBadge" class="bg-[#EBF7FF] text-[#1B85C9] text-[11px] font-extrabold px-3 py-1 rounded-full">請出示給工作人員</span>
        <button onclick="hideFlashcardModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold flex items-center justify-center">✕</button>
      </div>
      <div id="modalStaffHint" class="hidden bg-[#FFF7EB] text-[#B86E08] text-xs font-extrabold px-3.5 py-2.5 rounded-2xl">
        請出示給閘門附近穿制服的工作人員
      </div>
      <div class="bg-[#F4F9FD] rounded-2xl p-5 space-y-2.5">
        <p id="modalZhText" class="text-2xl font-black text-[#2C3E50] leading-snug"></p>
        <p id="modalViText" class="text-xs font-semibold text-slate-500 leading-relaxed"></p>
      </div>
      <button onclick="replayModalAudio()" class="w-full py-3.5 rounded-full bg-[#45B6FE] text-white font-extrabold text-sm flex items-center justify-center gap-2 active:scale-98 transition-transform">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        <span id="modalSpeakLabel">Nghe lại / 再次播放</span>
      </button>
    </div>
  </div>

  <!-- Custom Reset Confirmation Modal -->
  <div id="resetModal" onclick="if(event.target===this) closeResetModal()" class="fixed inset-0 z-50 hidden bg-[#2C3E50]/50 flex items-center justify-center p-5">
    <div class="bg-white rounded-[28px] w-full max-w-xs p-6 space-y-4 text-center">
      <h3 id="resetModalTitle" class="text-base font-extrabold text-[#2C3E50]">Đặt lại tiến độ?</h3>
      <div class="flex gap-2.5">
        <button onclick="closeResetModal()" class="flex-1 py-3 rounded-full bg-slate-100 text-slate-600 text-xs font-extrabold">Hủy / 取消</button>
        <button onclick="confirmResetProgress()" class="flex-1 py-3 rounded-full bg-[#F5946E] text-white text-xs font-extrabold">Đặt lại / 重置</button>
      </div>
    </div>
  </div>

  <!-- Custom Room Code Modal -->
  <div id="roomModal" onclick="if(event.target===this) closeRoomCodeModal()" class="fixed inset-0 z-50 hidden bg-[#2C3E50]/50 flex items-center justify-center p-5">
    <div class="bg-white rounded-[28px] w-full max-w-xs p-6 space-y-4">
      <h3 class="text-sm font-extrabold text-[#2C3E50]">Mã phòng / 房間代碼 (6 số)</h3>
      <input id="roomCodeInput" type="text" maxlength="6" inputmode="numeric" class="w-full bg-[#F4F9FD] border border-[#E3EFF8] rounded-2xl px-4 py-3 text-center text-lg font-black tracking-widest text-[#2C3E50] focus:outline-none focus:border-[#45B6FE]" />
      <div class="bg-[#F4F9FD] rounded-2xl p-3 space-y-2">
        <div class="text-[11px] font-extrabold text-[#1E8FD5]">免下載 App・瀏覽器直接通知</div>
        <p class="text-[11px] font-semibold text-slate-500 leading-relaxed">打開網頁並點右上角「開啟通知」即可響鈴＋震動；解鎖手機切回網頁也會自動補抓最新進度。</p>
        <button onclick="sendTestNotification()" class="w-full py-2.5 rounded-full bg-[#E6F8F7] text-[#1A948E] text-xs font-extrabold">🔔 發送測試通知（響鈴＋震動）</button>
      </div>
      <div class="flex gap-2.5">
        <button onclick="closeRoomCodeModal()" class="flex-1 py-2.5 rounded-full bg-slate-100 text-slate-600 text-xs font-extrabold">Hủy</button>
        <button onclick="saveCustomRoomCode()" class="flex-1 py-2.5 rounded-full bg-[#45B6FE] text-white text-xs font-extrabold">Lưu / 儲存</button>
      </div>
    </div>
  </div>

    // App State
    let state = {
      direction: 'outbound',
      lang: 'vi',
      activeTab: 'journey',
      roomCode: '521733',
      notifyEnabled: false,
      completed: { outbound: [], inbound: [] },
      timers: {
        outbound: { seconds: 6000, running: false },
        inbound: { seconds: 6000, running: false }
      },
      modalAudio: { zh: '', vi: '' }
    };

    let timerIntervals = { outbound: null, inbound: null };
    let ntfyEventSource = null;
    let toastTimeout = null;
    let lastSentEvent = { text: '', time: 0 };
    const seenEventIds = new Set();

    // Initialize app state, room stream, and tab-visibility catch-up sync
    function init() {
      loadSavedState();
      initRoomCode();
      startNtfyStream();
      fetchMissedEvents();
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          startNtfyStream();
          fetchMissedEvents();
        }
      });
      renderAll();
    }

    function initRoomCode() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        const urlDir = params.get('dir');
        const savedRoom = localStorage.getItem('taipei_quest_room');

        if (urlRoom && /^\d{6}$/.test(urlRoom)) {
          state.roomCode = urlRoom;
          state.notifyEnabled = true;
          localStorage.setItem('taipei_quest_room', urlRoom);
        } else if (savedRoom && /^\d{6}$/.test(savedRoom)) {
          state.roomCode = savedRoom;
        }

        if (urlDir === 'outbound' || urlDir === 'inbound') {
          state.direction = urlDir;
        }
        syncUrlSilently();
      } catch (e) {}
    }

    function syncUrlSilently() {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('room', state.roomCode);
        url.searchParams.set('dir', state.direction);
        window.history.replaceState({}, '', url.toString());
      } catch (e) {}
    }

    function showToast(msg) {
      const banner = document.getElementById('toastBanner');
      const textEl = document.getElementById('toastText');
      if (!banner || !textEl) return;
      textEl.textContent = msg;
      banner.classList.remove('hidden');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        banner.classList.add('hidden');
      }, 2800);
    }

    function copyShareLink() {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('room', state.roomCode);
        url.searchParams.set('dir', state.direction);
        const shareUrl = url.toString();
        const tempInput = document.createElement('input');
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast(state.lang === 'vi' ? `Đã chép link phòng #${state.roomCode}` : `已複製專屬連結 (#${state.roomCode})`);
      } catch (e) {}
    }

    function loadSavedState() {
      try {
        const saved = localStorage.getItem('taipei_quest_v4');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.completed) state.completed = parsed.completed;
          if (parsed.lang) state.lang = parsed.lang;
          if (parsed.direction) state.direction = parsed.direction;
          if (typeof parsed.notifyEnabled === 'boolean') state.notifyEnabled = parsed.notifyEnabled;
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem('taipei_quest_v4', JSON.stringify({
          completed: state.completed,
          lang: state.lang,
          direction: state.direction,
          notifyEnabled: state.notifyEnabled
        }));
      } catch (e) {}
    }

    function playChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        [587.33, 880].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.12);
          gain.gain.setValueAtTime(0.12, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.36);
        });
      } catch (e) {}
    }

    function openRoomCodeModal() {
      document.getElementById('roomCodeInput').value = state.roomCode;
      document.getElementById('roomModal').classList.remove('hidden');
    }

    function closeRoomCodeModal() {
      document.getElementById('roomModal').classList.add('hidden');
    }

    // Trigger test alert with chime, vibration, and system browser banner
    function sendTestNotification() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(() => {});
      }
      publishRoomEvent(`🔔 測試通知成功！房間 #${state.roomCode} 已連線`);
      triggerBrowserNotification(`測試通知成功！房間 #${state.roomCode} 已連線`);
    }

    // Validate and apply custom 6-digit room code
    function saveCustomRoomCode() {
      const inputEl = document.getElementById('roomCodeInput');
      const val = inputEl ? inputEl.value.trim() : '';
      if (!/^\d{6}$/.test(val)) {
        showToast(state.lang === 'vi' ? 'Vui lòng nhập đúng 6 chữ số' : '請輸入 6 位數字房間代碼');
        return;
      }
      state.roomCode = val;
      seenEventIds.clear();
      try {
        localStorage.setItem('taipei_quest_room', val);
      } catch (e) {}
      syncUrlSilently();
      startNtfyStream();
      fetchMissedEvents();
      closeRoomCodeModal();
      renderAll();
      showToast(state.lang === 'vi' ? `Đã đổi sang phòng #${val}` : `已切換至房間 #${val}`);
    }

    // Toggle browser notifications and request native system notification permission
    function toggleNotifications() {
      state.notifyEnabled = !state.notifyEnabled;
      saveState();
      if (state.notifyEnabled) {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }
        startNtfyStream();
        fetchMissedEvents();
        playChime();
        if (navigator.vibrate) navigator.vibrate(200);
        showToast(state.lang === 'vi' ? `Đã bật thông báo phòng #${state.roomCode}` : `已開啟房間 #${state.roomCode} 瀏覽器通知`);
      }
      renderAll();
    }

    // Play chime, vibrate phone, show banner, and fire native browser notification
    function triggerBrowserNotification(msg) {
      playChime();
      try {
        if (navigator.vibrate) navigator.vibrate([250, 120, 250]);
      } catch (e) {}
      showToast(`🔔 ${msg}`);
      try {
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('台灣搭車進度通知', {
            body: msg,
            tag: 'taipei-quest-alert'
          });
        }
      } catch (e) {}
    }

    // Sync step completion badges when receiving check-in messages from brother's phone
    function syncStepFromMessage(msg) {
      if (!msg || !msg.startsWith('✅')) return false;
      let changed = false;
      ['outbound', 'inbound'].forEach(dir => {
        JOURNEY_DATA[dir].steps.forEach(step => {
          if (msg.includes(step.title) && !state.completed[dir].includes(step.id)) {
            state.completed[dir].push(step.id);
            state.completed[dir].sort((a, b) => a - b);
            changed = true;
          }
        });
      });
      if (changed) {
        saveState();
        renderAll();
      }
      return changed;
    }

    // Process incoming SSE or catch-up poll events without duplicates
    function handleIncomingPayload(payload, isCatchUp = false) {
      if (!payload || !payload.message) return;
      if (payload.id) {
        if (seenEventIds.has(payload.id)) return;
        seenEventIds.add(payload.id);
      }
      const isSelfEcho = payload.message === lastSentEvent.text && (Date.now() - lastSentEvent.time < 4500);
      if (isSelfEcho) return;

      syncStepFromMessage(payload.message);

      if (state.notifyEnabled || payload.message.startsWith('🆘')) {
        if (!isCatchUp) {
          triggerBrowserNotification(payload.message);
        } else {
          showToast(`🔔 ${payload.message}`);
        }
      }
    }

    // Fetch recent events when unlocking phone or switching back to browser
    function fetchMissedEvents() {
      try {
        fetch(`https://ntfy.sh/taipei-quest-${state.roomCode}/json?poll=1&since=2h`)
          .then(res => res.text())
          .then(text => {
            const lines = text.trim().split('\n').filter(Boolean);
            lines.forEach((line, idx) => {
              try {
                const payload = JSON.parse(line);
                if (payload.event === 'message') {
                  const isLatest = idx === lines.length - 1;
                  handleIncomingPayload(payload, !isLatest);
                }
              } catch (e) {}
            });
          })
          .catch(() => {});
      } catch (e) {}
    }

    function startNtfyStream() {
      if (ntfyEventSource) ntfyEventSource.close();
      try {
        ntfyEventSource = new EventSource(`https://ntfy.sh/taipei-quest-${state.roomCode}/sse`);
        ntfyEventSource.onmessage = (event) => {
          try {
            const payload = JSON.parse(event.data);
            handleIncomingPayload(payload, false);
          } catch (err) {}
        };
      } catch (e) {}
    }

    function publishRoomEvent(text) {
      lastSentEvent = { text, time: Date.now() };
      try {
        fetch(`https://ntfy.sh/taipei-quest-${state.roomCode}`, {
          method: 'POST',
          headers: { 'Title': 'Taiwan Transport Guide' },
          body: text
        }).catch(() => {});
      } catch (e) {}
    }

    function speakChinese(text, btnEl) {
      if (btnEl) {
        document.querySelectorAll('.tts-active').forEach(el => el.classList.remove('tts-active'));
        btnEl.classList.add('tts-active');
        setTimeout(() => btnEl.classList.remove('tts-active'), 1600);
      }
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'zh-TW';
          utter.rate = 0.92;
          window.speechSynthesis.speak(utter);
        }
      } catch (e) {}
    }

    function playStepPhrase(stepIdx, pIdx, btnEl, showStaffBadge = false) {
      const step = JOURNEY_DATA[state.direction].steps[stepIdx];
      if (!step || !step.phrases || !step.phrases[pIdx]) return;
      const p = step.phrases[pIdx];
      speakChinese(p.zh, btnEl);
      openFlashcardModal(p.zh, p.vi, showStaffBadge);
    }

    function playThsrPhrase(stepIdx, phraseKey, btnEl) {
      const step = JOURNEY_DATA[state.direction].steps[stepIdx];
      if (!step || !step[phraseKey]) return;
      const p = step[phraseKey];
      speakChinese(p.zh, btnEl);
      openFlashcardModal(p.zh, p.vi, false);
    }

    function playFlashcardByIndex(idx, btnEl) {
      const all = getCurrentFlashcards();
      const item = all[idx];
      if (!item) return;
      speakChinese(item.zh, btnEl);
    }

      document.getElementById('modalViText').textContent = vi;

      } else {
        hint.classList.add('hidden');
      }
      document.getElementById('flashcardModal').classList.remove('hidden');
    }

    function replayModalAudio() {
      if (state.modalAudio.zh) speakChinese(state.modalAudio.zh, null);
    }

    function hideFlashcardModal() {
      document.getElementById('flashcardModal').classList.add('hidden');
    }

    function closeFlashcardModal(e) {
      if (e.target.id === 'flashcardModal') hideFlashcardModal();
    }

    function openSosFlashcard() {
      speakChinese(SOS_PHRASE.zh, null);
      publishRoomEvent('🆘 弟弟按下了 SOS 求助字卡！');
      openFlashcardModal(SOS_PHRASE.zh, SOS_PHRASE.vi, true);
    }

    function switchDirection(dir) {
      state.direction = dir;
      saveState();
      syncUrlSilently();
      renderAll();
    }

    function toggleLanguage() {
      state.lang = state.lang === 'vi' ? 'zh' : 'vi';
      saveState();
      renderAll();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      ['journey', 'tickets', 'cards', 'info'].forEach(t => {
        const view = document.getElementById(`tab-${t}`);
        const navBtn = document.getElementById(`nav-${t}`);
        const navLbl = document.getElementById(`navLabel${t.charAt(0).toUpperCase() + t.slice(1)}`);
        if (t === tab) {
          view.classList.remove('hidden');
          navBtn.className = 'px-4 py-2 rounded-full bg-[#45B6FE] text-white text-xs font-extrabold flex items-center gap-1.5 transition-colors';
          navLbl.classList.remove('hidden');
        } else {
          view.classList.add('hidden');
          navBtn.className = 'p-2.5 rounded-full text-slate-400 flex items-center gap-1.5 text-xs font-extrabold transition-colors';
          navLbl.classList.add('hidden');
        }
      });
    }

    function toggleStepDone(stepId) {
      const list = state.completed[state.direction];
      const idx = list.indexOf(stepId);
      const steps = JOURNEY_DATA[state.direction].steps;
      const stepObj = steps.find(s => s.id === stepId);

      if (idx === -1) {
        list.push(stepId);
        list.sort((a, b) => a - b);
        playChime();
        if (stepObj) publishRoomEvent(`✅ ${stepObj.title} (${stepObj.btnDoneZh})`);
        saveState();
        renderAll();

        const nextStep = steps.find(s => !list.includes(s.id));
        if (nextStep) {
          setTimeout(() => {
            const nextCard = document.getElementById(`step-card-${nextStep.id}`);
            if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 220);
        }
      } else {
        list.splice(idx, 1);
        saveState();
        renderAll();
      }
    }

    function scrollToStep(stepId) {
      const el = document.getElementById(`step-card-${stepId}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function openThsrTimetable(fromCode, toCode) {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).formatToParts(now);
      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });
      const dateStr = `${map.year}-${map.month}-${map.day}`;
      const timeStr = `${map.hour}${map.minute}`;
      const url = `https://traintime.jsy.tw/THSR/search?s=${fromCode}&e=${toCode}&d=${dateStr}&t=${timeStr}`;
      window.open(url, '_blank', 'noopener');
    }

    function promptResetProgress() {
      document.getElementById('resetModalTitle').textContent = state.lang === 'vi' ? 'Đặt lại tiến độ?' : '確定要重置進度嗎？';
      document.getElementById('resetModal').classList.remove('hidden');
    }

    function closeResetModal() {
      document.getElementById('resetModal').classList.add('hidden');
    }

    function confirmResetProgress() {
      state.completed[state.direction] = [];
      saveState();
      closeResetModal();
      renderAll();
    }

    function formatSeconds(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function toggleThsrTimer() {
      const dir = state.direction;
      const t = state.timers[dir];
      if (t.running) {
        clearInterval(timerIntervals[dir]);
        t.running = false;
      } else {
        t.running = true;
        timerIntervals[dir] = setInterval(() => {
          if (t.seconds > 0) {
            t.seconds--;
            updateTimerDom();
          } else {
            clearInterval(timerIntervals[dir]);
            t.running = false;
            playChime();
            showToast(state.lang === 'vi' ? 'Sắp tới ga rồi! Chuẩn bị xuống tàu' : '即將到站，請準備下車！');
            updateTimerDom();
          }
        }, 1000);
      }
      updateTimerDom();
    }

    function resetThsrTimer() {
      const dir = state.direction;
      clearInterval(timerIntervals[dir]);
      state.timers[dir] = { seconds: 6000, running: false };
      updateTimerDom();
    }

    function updateTimerDom() {
      const t = state.timers[state.direction];
      const display = document.getElementById('thsrTimerDisplay');
      const btn = document.getElementById('thsrTimerBtn');
      if (display) display.textContent = formatSeconds(t.seconds);
      if (btn) {
        btn.textContent = t.running
          ? (state.lang === 'vi' ? 'Tạm dừng' : '暫停')
          : (state.lang === 'vi' ? 'Bắt đầu' : '開始');
        btn.className = t.running
          ? 'px-3.5 py-1.5 rounded-full bg-[#F7AD3E] text-white text-xs font-extrabold'
          : 'px-3.5 py-1.5 rounded-full bg-[#45B6FE] text-white text-xs font-extrabold';
      }
    }

    function getCurrentFlashcards() {
      const data = JOURNEY_DATA[state.direction];
      const all = [];
      data.steps.forEach(s => {
        if (s.phrases) s.phrases.forEach(p => all.push(p));
        if (s.ticketPhrase) all.push(s.ticketPhrase);
        if (s.platformPhrase) all.push(s.platformPhrase);
        if (s.freeSeatPhrase) all.push(s.freeSeatPhrase);
      });
      return all;
    }

      return `<svg class="w-4 h-4 text-[#F5946E]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M6 18L18 6"/></svg>`;

                <button onclick="playThsrPhrase(${stepIdx}, 'freeSeatPhrase', this)" class="speech-btn rounded-2xl px-3.5 py-3 flex items-center justify-between gap-1.5 text-left">
                  <span class="text-[11px] font-extrabold text-[#2C3E50]">${isVi ? s.freeSeatChipVi : s.freeSeatChipZh}</span>
                  <svg class="w-4 h-4 text-[#45B6FE] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                </button>
              </div>

              <!-- 3 Seat Rules Strip -->
              <div class="grid grid-cols-3 gap-1.5 text-center">
                ${s.seatRules.map(r => {
                  const chipColors = r.color === 'sky'
                    ? 'bg-[#EBF7FF] text-[#1E8FD5]'
                    : (r.color === 'amber' ? 'bg-[#FFF7EB] text-[#D9820B]' : 'bg-[#E6F8F7] text-[#1A948E]');
                  return `
                    <div class="${chipColors} rounded-xl px-2 py-2">
                      <div class="text-[10px] font-extrabold">${isVi ? r.badgeVi : r.badgeZh}：${isVi ? r.descVi : r.descZh}</div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Arrival Broadcast Alert -->
              <div class="bg-[#F4F9FD] rounded-2xl px-4 py-2.5 flex items-center gap-2 text-xs font-extrabold text-[#2C3E50]">
                <svg class="w-4 h-4 text-[#F7AD3E] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                <span>${isVi ? s.nextStationVi : s.nextStationZh}</span>
              </div>

              <!-- 1h 40m Countdown Timer -->
              <div class="bg-[#F4F9FD] rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <svg class="w-4 h-4 text-[#F7AD3E]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 7v5l3 2"/></svg>
                  <span id="thsrTimerDisplay" class="text-sm font-extrabold text-[#2C3E50] tabular-nums">${formatSeconds(t.seconds)}</span>
                </div>
                <div class="flex items-center gap-2">
                  <button id="thsrTimerBtn" onclick="toggleThsrTimer()" class="${t.running ? 'px-3.5 py-1.5 rounded-full bg-[#F7AD3E] text-white text-xs font-extrabold' : 'px-3.5 py-1.5 rounded-full bg-[#45B6FE] text-white text-xs font-extrabold'}">
                    ${t.running ? (isVi ? 'Tạm dừng' : '暫停') : (isVi ? 'Bắt đầu' : '開始')}
                  </button>
                  <button onclick="resetThsrTimer()" class="w-7 h-7 rounded-full bg-white text-slate-400 text-xs font-bold flex items-center justify-center">↻</button>
                </div>
              </div>

              <button onclick="toggleStepDone(${s.id})" class="w-full py-3.5 rounded-full font-extrabold text-sm flex items-center justify-center gap-2 transition-colors active:scale-98 ${btnClass}">
                <span>${isDone ? `✓ ${isVi ? s.btnDoneVi : s.btnDoneZh}` : (isVi ? s.btnTodoVi : s.btnTodoZh)}</span>
              </button>
            </article>
          `;
        }

        // TYPE 4: DESTINATION STATION CARD
        const btnClass = isDone ? 'bg-[#3CC6C0] text-white' : 'bg-[#45B6FE] text-white';

        const exitNotesHtml = s.exitNotes.map(n => `
          <div class="bg-[#F4F9FD] rounded-2xl px-2 py-2.5 flex flex-col items-center justify-center gap-1 text-center">
            ${renderExitRuleIcon(n.icon)}
            <span class="text-[11px] font-extrabold text-[#2C3E50] leading-tight">${isVi ? n.vi : n.zh}</span>
          </div>
        `).join('');

        const phrasesGridHtml = s.phrases.map((p, pIdx) => `
          <button onclick="playStepPhrase(${stepIdx}, ${pIdx}, this, true)" class="bg-white rounded-xl px-3.5 py-2.5 w-full flex items-center justify-between gap-2 text-left active:scale-98 transition-transform">
            <span class="text-xs font-extrabold text-[#2C3E50]">${isVi ? p.labelVi : p.labelZh}</span>
            <svg class="w-4 h-4 text-[#45B6FE] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
          </button>
        `).join('');

        return `
          <article id="step-card-${s.id}" class="soft-card p-5 space-y-3.5 ${cardStateClass}">
            <div class="bg-[#EBF7FF] rounded-2xl p-4 flex items-center justify-between gap-2">
              <div class="space-y-1">
                <div class="flex items-center gap-1.5">
                  <span class="text-[11px] font-extrabold text-[#1E8FD5]">${s.tagLeft}</span>
                  <span class="bg-white text-[#1E8FD5] text-[10px] font-extrabold px-2 py-0.5 rounded-full">+${s.xp} XP</span>
                </div>
                <h2 class="text-lg font-extrabold text-[#2C3E50]">${s.title}</h2>
              </div>
              <div class="w-10 h-10 rounded-full bg-white text-[#45B6FE] flex items-center justify-center shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
              </div>
            </div>

            <!-- Warm Honey Yellow West Exit Signboard -->
            <div class="bg-[#FFF7EB] rounded-2xl px-4 py-3 flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-[#F7AD3E] text-white flex items-center justify-center shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
              </div>
              <div class="flex items-baseline gap-2">
                <span class="text-base font-black text-[#2C3E50]">${s.signMain}</span>
                <span class="text-xs font-extrabold text-[#D9820B]">${s.signSub}</span>
              </div>
            </div>

            <!-- Exit Rules Grid -->
            <div class="grid ${s.exitNotes.length === 2 ? 'grid-cols-2' : 'grid-cols-3'} gap-2">
              ${exitNotesHtml}
            </div>

            <!-- Unified Staff Help Card -->
            <div class="bg-[#F4F9FD] rounded-2xl p-3.5 space-y-2">
              <div class="flex items-center gap-2 text-[11px] font-extrabold text-[#1E8FD5]">
                <svg class="w-4 h-4 text-[#45B6FE] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                <span>${isVi ? s.staffHeaderVi : s.staffHeaderZh}</span>
              </div>
              <div class="space-y-2">
                ${phrasesGridHtml}
              </div>
            </div>

            <button onclick="toggleStepDone(${s.id})" class="w-full py-3.5 rounded-full font-extrabold text-sm flex items-center justify-center gap-2 transition-colors active:scale-98 ${btnClass}">
              <span>${isDone ? `✓ ${isVi ? s.btnDoneVi : s.btnDoneZh}` : (isVi ? s.btnTodoVi : s.btnTodoZh)}</span>
            </button>
          </article>
        `;
      }).join('');

      // Tab 3 Flashcards List
      const allPhrases = getCurrentFlashcards();
      document.getElementById('flashcardListContainer').innerHTML = allPhrases.map((p, idx) => `
        <button onclick="playFlashcardByIndex(${idx}, this)" class="soft-card w-full p-4 text-left space-y-1.5 active:scale-98 transition-transform">
          <div class="flex items-center justify-between">
            <span class="bg-[#EBF7FF] text-[#1E8FD5] text-[11px] font-extrabold px-2.5 py-0.5 rounded-full">${isVi ? p.labelVi : p.labelZh}</span>
            <svg class="w-4 h-4 text-[#45B6FE]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
          </div>
          <p class="text-lg font-black text-[#2C3E50] leading-snug">${p.zh}</p>
          <p class="text-xs font-semibold text-slate-500">${p.vi}</p>
        </button>
      `).join('');

      // Tab 4 Info Checklist
      const destStep = data.steps[3];
      document.getElementById('infoTitle').textContent = isVi ? `Lưu ý tại ${destStep.title}` : `${destStep.title} 下車重點`;
      document.getElementById('infoNotesList').innerHTML = destStep.exitNotes.map(n => `
        <div class="bg-[#F4F9FD] rounded-2xl p-3 flex flex-col items-center gap-1.5">
          ${renderExitRuleIcon(n.icon)}
          <span>${isVi ? n.vi : n.zh}</span>
        </div>
      `).join('');
      document.getElementById('infoTimetableLabel').textContent = isVi ? 'Giờ tàu TRA' : '台鐵時刻表';
      document.getElementById('infoThsrTimetableLabel').textContent = isVi ? 'Giờ tàu THSR' : '高鐵時刻表';
    }

    window.onload = init;
  </script>
</body>
</html>
